<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="oklch(0.95 0.03 70)"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="oklch(0.25 0.03 70)"
    />
    <title>Copy demo DB › Slow Reader</title>
    <style>
      :root {
        color-scheme: light dark;
        height: 100%;

        @media (prefers-color-scheme: light) {
          --loader-background: oklch(1 0 0);
          --loader-bar: oklch(0.3 0 0);

          background: oklch(0.95 0.03 70);
          color: oklch(0.3 0 0);
        }

        @media (prefers-color-scheme: dark) {
          --loader-background: oklch(1 0 0 / 20%);
          --loader-bar: oklch(0.9 0 0);

          background: oklch(0.25 0.03 70);
          color: oklch(0.9 0 0);
        }
      }

      .is-light-theme {
        --loader-background: oklch(1 0 0);
        --loader-bar: oklch(0.3 0 0);

        color-scheme: light;
        background: oklch(0.95 0.03 70);
        color: oklch(0.3 0 0);
      }

      .is-dark-theme {
        --loader-background: oklch(1 0 0 / 20%);
        --loader-bar: oklch(0.9 0 0);

        color-scheme: dark;
        background: oklch(0.25 0.03 70);
        color: oklch(0.9 0 0);
      }

      body {
        min-height: 100%;
        margin: 0;
        font:
          400 0.9375rem/1.6 'Noto Sans Variable',
          Arial,
          sans-serif;
      }

      .captioned {
        display: grid;
        grid-template-rows: 1fr auto 1fr;
        justify-items: center;
        min-block-size: 100vh;
      }

      .captioned_content {
        grid-row: 2;
        inline-size: 100%;
      }

      .captioned_bottom {
        display: flex;
        flex-direction: column;
        grid-row: 3;
        align-self: start;
        max-inline-size: 20rem;
        padding-block-start: 0.625rem;
      }

      .caption {
        margin: 0;
        font-size: 0.875rem;
        color: oklch(0.6 0.05 70);
        text-align: center;

        @media (prefers-color-scheme: dark) {
          color: oklch(0.7 0.05 70);
        }
      }

      .is-light-theme .caption {
        color: oklch(0.6 0.05 70);
      }

      .is-dark-theme .caption {
        color: oklch(0.7 0.05 70);
      }

      /* The message replaces the loader, so it is the page’s main text */
      .caption.is-message {
        font-size: 0.9375rem;
        color: inherit;
      }

      .loader {
        position: relative;
        display: block;
        width: 100%;
        max-width: 10rem;
        height: 0.375rem;
        margin: 0 auto;
        overflow: hidden;
        appearance: none;
        background: var(--loader-background);
        border: none;
        border-radius: 0.1875rem;
      }

      /* `.loader` sets `display`, so it wins over the browser’s `[hidden]` */
      .loader[hidden] {
        display: none;
      }

      .loader::-webkit-progress-bar {
        background: transparent;
      }

      .loader::-webkit-progress-value {
        background: var(--loader-bar);
        border-radius: 0.1875rem;
      }

      .loader::-moz-progress-bar {
        background: var(--loader-bar);
        border-radius: 0.1875rem;
      }

      /* Safari only */
      @supports (background: -webkit-named-image(i)) {
        .loader:indeterminate::-webkit-progress-value {
          transform: translateX(-50%);
          animation: --loader-bouncing 1.8s infinite
            cubic-bezier(0.45, 0, 0.55, 1);
        }
      }

      /* Chromium only */
      @supports (not (-moz-appearance: none)) and
        (not (background: -webkit-named-image(i))) {
        .loader:indeterminate::-webkit-progress-value {
          background: transparent;
        }

        .loader:indeterminate::after {
          position: absolute;
          inset: 0;
          content: '';
          background: var(--loader-bar);
          border-radius: 2px;
          transform: translateX(-50%);
          animation: --loader-bouncing 1.8s infinite
            cubic-bezier(0.45, 0, 0.55, 1);
        }
      }

      /* Firefox only */
      .loader:indeterminate::-moz-progress-bar {
        transform: translateX(-50%);
        animation: --loader-bouncing 1.8s infinite
          cubic-bezier(0.45, 0, 0.55, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .loader {
          background: repeating-linear-gradient(
            -45deg,
            var(--loader-bar),
            var(--loader-bar) 0.625rem,
            var(--loader-background) 0.625rem,
            var(--loader-background) 1.25rem
          );
        }

        .loader::after {
          display: none;
        }

        .loader::-webkit-progress-value {
          background: transparent;
          animation: none !important;
        }

        .loader::-moz-progress-bar {
          background: transparent;
          animation: none !important;
        }
      }

      @keyframes --loader-bouncing {
        0% {
          width: 25%;
          margin-inline-start: 12.5%;
        }

        20% {
          width: 50%;
        }

        30% {
          width: 50%;
        }

        50% {
          width: 25%;
          margin-inline-start: 87.5%;
        }

        70% {
          width: 50%;
        }

        80% {
          width: 50%;
        }

        100% {
          width: 25%;
          margin-inline-start: 12.5%;
        }
      }
    </style>
  </head>

  <body>
    <div class="captioned">
      <div class="captioned_content">
        <progress
          class="loader"
          id="loader"
          aria-label="Copy demo DB"
        ></progress>
      </div>
      <div class="captioned_bottom">
        <p class="caption" id="caption" aria-hidden="true">Copy demo DB</p>
      </div>
    </div>
    <script type="module">
      const DATABASE = 'slowreader.sqlite'

      // The app’s leader tab holds this lock while it is open
      const APP_LOCK = 'logux_leader'

      let caption = document.getElementById('caption')
      let loader = document.getElementById('loader')

      let theme = localStorage.getItem('slowreader:theme') || 'system'
      document.documentElement.classList.toggle(
        'is-dark-theme',
        theme === 'dark'
      )
      document.documentElement.classList.toggle(
        'is-light-theme',
        theme === 'light'
      )

      function message(text) {
        loader.hidden = true
        caption.removeAttribute('aria-hidden')
        caption.classList.add('is-message')
        caption.textContent = text
      }

      async function appIsOpen() {
        if (!navigator.locks) return false
        let { held, pending } = await navigator.locks.query()
        return [...held, ...pending].some(lock => lock.name === APP_LOCK)
      }

      async function load(path) {
        let response = await fetch(path, { cache: 'no-store' })
        if (!response.ok) {
          throw new Error(`${path} answered ${response.status}`)
        }
        return response
      }

      async function sha256(bytes) {
        let digest = await crypto.subtle.digest('SHA-256', bytes)
        return [...new Uint8Array(digest)]
          .map(byte => byte.toString(16).padStart(2, '0'))
          .join('')
      }

      async function copy() {
        if (await appIsOpen()) {
          message('Slow Reader is open in another tab. Close it and reload.')
          return
        }
        // “Delete all local data” keeps the empty database file in OPFS,
        // so only the user says whether the browser has data to lose
        if (localStorage.getItem('slowreader:userId')) {
          message('Slow Reader has data here. Delete it in Storage settings.')
          return
        }

        let manifest = await (await load('/demo.json')).json()
        let bytes = new Uint8Array(
          await (await load(`/${manifest.database.file}`)).arrayBuffer()
        )
        // The settings cache the IDs of the rows of their own build, so a database
        // from another build would leave the menu pointing to missing feeds
        if ((await sha256(bytes)) !== manifest.database.sha256) {
          message('Demo files are from different builds. Rebuild them.')
          return
        }

        // The database goes first: the settings without it start the app with
        // an empty database, which its schema mark claims to be already filled
        let root = await navigator.storage.getDirectory()
        let file = await root.getFileHandle(DATABASE, { create: true })
        let writable = await file.createWritable()
        await writable.write(bytes)
        await writable.close()

        localStorage.clear()
        for (let [key, value] of Object.entries(manifest.storage)) {
          localStorage.setItem(key, value)
        }

        location.href = '/'
      }

      copy().catch(e => {
        message(`Failed to copy the demo: ${e.message}`)
      })
    </script>
  </body>
</html>
