# Web server to serve web client for staging and pull request previews

worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log stderr error;
  server_tokens off;

  include mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;
  charset_types application/javascript text/css application/manifest+json image/svg+xml;
  sendfile on;

  # Browsers get the page with the design, other clients get the short answer
  map $http_accept $not_found {
    default /404;
    ~*text/html /404.html;
  }

  server {
    listen 8000;

    root /var/www;
    charset UTF-8;
    gzip_static on;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    error_page 404 $not_found;
    error_page 500 /500.html;

    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header X-Content-Type-Options "nosniff";
    # SQLite in OPFS needs cross-origin isolation to save the database
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "credentialless";
    add_header Content-Security-Policy "object-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; style-src 'sha256-SmAM1DSNiCCdAEabBHfOLWn8GuDZmajUjuFmodxWN5E=' 'sha256-jao29H8BKSlaiUqByFnf6MxYoYKKc1augDeFhsmIVag=' 'sha256-A+WIF57Zi2pZ+PSfiD5lb/2xvVRTUhW02IK/tX5ZT3s=' 'sha256-uiWkQb6L1FmUhEr5KBFM9oqhcGX0BqUksFZpGOiLpWo=' 'self'; script-src 'sha256-iliif2S6Fr8mQazzDJs2huHUeow98/TYx+Staat/56E=' 'wasm-unsafe-eval' 'self'; require-trusted-types-for 'script'; trusted-types default dompurify slowreader-rich svelte-trusted-html slowreader-parse";

    location = /404 {
      internal;
      default_type text/plain;
      return 404 "Not found\n";
    }

    location ~* __ROUTES__ {
      try_files /index.html =404;
    }

    location ~* ^(/ui)?/assets {
      expires 1y;
      add_header Cache-Control 'public';
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
      add_header X-Content-Type-Options "nosniff";
      add_header Cross-Origin-Opener-Policy "same-origin";
      add_header Cross-Origin-Embedder-Policy "credentialless";
    }

    rewrite ^/ui$ /ui/ permanent;

    location /ui/ {
      add_header Content-Security-Policy "";
      try_files $uri $uri/ =404;
    }

    location / {
      rewrite ^(.+)/$ $1 permanent;
      try_files $uri $uri/ =404;
    }
  }
}
