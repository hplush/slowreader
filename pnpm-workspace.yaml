packages:
  - api
  - core
  - server
  - web
  - landings
  - proxy
  - loader-tests
  - extension

overrides:
  '@sqlite.org/sqlite-wasm': 3.53.4-build1

storeDir: node_modules/.pnpm-store

allowBuilds:
  argon2: false
  esbuild: true
  unrs-resolver: false

forceLegacyDeploy: true

minimumReleaseAge: 1440

dedupePeers: true

minimumReleaseAgeExclude:
  - postcss
  - postcss-smooth-shadow
  - '@nanostores/*'
  - '@logux/*'
  - '@size-limit/*'
  - size-limit
  - browserslist
  - update-browserslist-db
  - caniuse-lite
  - baseline-browser-mapping
  - autoprefixer
  - multiocular
  - keyux
  - esbuild
  - nanoid

verifyDepsBeforeRun: false

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080
