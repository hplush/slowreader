packages:
  - api
  - core
  - server
  - test
  - web
  - landings
  - proxy
  - loader-tests
  - extension

storeDir: node_modules/.pnpm-store

allowBuilds:
  esbuild: true
  unrs-resolver: false

minimumReleaseAge: 1440

dedupePeers: true

minimumReleaseAgeExclude:
  - postcss
  - postcss-smooth-shadow
  - postcss-smooth-corners
  - '@nanostores/*'
  - '@logux/*'
  - '@size-limit/*'
  - size-limit
  - browserslist
  - update-browserslist-db
  - caniuse-lite
  - baseline-browser-mapping
  - autoprefixer
  - multiocular
  - keyux
  - esbuild
  - nanoid

verifyDepsBeforeRun: false

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 10080

auditConfig:
  ignoreGhsas:
    # deepmerge has no fix, vite-plugin-svelte merges only our own config
    - GHSA-gcqx-w48m-w2h4
