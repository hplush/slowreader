// Replace Ubuntu’s list to have the same explicit list on every server
#clear Unattended-Upgrade::Allowed-Origins;
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
  "origin=Ubuntu,archive=${distro_codename}";
  "origin=Ubuntu,archive=${distro_codename}-updates";
  "origin=Ubuntu,archive=${distro_codename}-security";
  "origin=UbuntuESMApps,archive=${distro_codename}-apps-security";
  "origin=UbuntuESM,archive=${distro_codename}-infra-security";
  "origin=cloudsmith/caddy/stable";
};
// reboot-if-needed.timer reboots if Livepatch can’t patch the kernel
// or a security update needs the reboot
Unattended-Upgrade::Automatic-Reboot "false";
// We change Caddyfile and exporters configs, which would stop their updates
Dpkg::Options {
  "--force-confdef";
  "--force-confold";
};
