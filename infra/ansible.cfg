[defaults]
inventory = inventory.yml
interpreter_python = /usr/bin/python3

[ssh_connection]
# Unprivileged become_user needs it to pass modules without temporary files
pipelining = True
# One hardware key touch for the whole playbook.
# IPv4, since ssh-access.sh opens only it.
ssh_args = -4 -o ControlMaster=auto -o ControlPersist=30m -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlias=slowreader.app
