[defaults]
inventory = inventory.yml
interpreter_python = /usr/bin/python3
# Otherwise failed run loses config changes, since next run sees no changes
force_handlers = True

[ssh_connection]
# Unprivileged become_user needs it to pass modules without temporary files
pipelining = True
# One hardware key touch for the whole playbook. Short persist, since other
# processes in Dev Container can reuse the connection.
# IPv4, since ssh-access.sh opens only it.
ssh_args = -4 -o ControlMaster=auto -o ControlPersist=10m -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlias=slowreader.app

[privilege_escalation]
# Ansible can’t answer sudo-rs password prompt, which is default in Ubuntu
become_exe = sudo.ws
