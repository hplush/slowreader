# Secrets are created by README steps on the server, so Ansible never sees
# them. Until then playbook skips parts, which need them.

- name: Check backup secrets
  ansible.builtin.stat:
    path: /etc/pgbackrest/conf.d/secrets.conf
  register: backup_secrets

- name: Check app secrets
  ansible.builtin.command: podman-as slowreader-app secret exists {{ item }}
  register: app_secrets
  changed_when: false
  failed_when: false
  loop:
    - database_url
    - analytics_token
