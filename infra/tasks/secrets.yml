# Secrets are created by README steps on the server, so Ansible never sees
# them. Until then playbook skips parts, which need them.

- name: Check backup secrets
  ansible.builtin.stat:
    path: /etc/pgbackrest/conf.d/secrets.conf
  register: backup_secrets

- name: Check app secrets
  ansible.builtin.command: podman-as app secret exists {{ item }}
  register: app_secrets
  changed_when: false
  failed_when: false
  loop:
    - database_url
    - analytics_token

- name: Show missing secrets
  ansible.builtin.debug:
    msg: Create secrets by Secrets section of infra/README.md and run Ansible again
  when: >-
    not caddy_env.stat.exists or not analytics_token.stat.exists or
    not backup_secrets.stat.exists or
    app_secrets.results | rejectattr('rc', 'equalto', 0) | list | length > 0
