- name: Configure SSH server
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-slowreader.conf
    content: |
      PermitRootLogin no
      AllowUsers ai deploy
      AuthenticationMethods publickey
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowAgentForwarding no
      AllowTcpForwarding no
      X11Forwarding no
    mode: '0644'
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Add maintainers keys to admin
  ansible.builtin.copy:
    dest: /home/ai/.ssh/authorized_keys
    content: |
      {% for key in maintainer_keys %}
      {{ key }}
      {% endfor %}
    owner: ai
    group: ai
    mode: '0600'

# Ubuntu’s .bashrc loads it after own prompt, so we keep Ubuntu’s defaults
- name: Configure admin shell
  ansible.builtin.copy:
    dest: /home/ai/.bash_aliases
    content: |
      export PS1="\n\[\e[01;31m\]\h \[\e[01;36m\]\w\n\[\e[0;32m\]❯\[\e[m\] "
      alias ..='cd ..'
    owner: ai
    group: ai
    mode: '0644'

# Without the password, removing NOPASSWD would lock us out of sudo
- name: Check admin password
  ansible.builtin.command: passwd --status ai
  register: admin_password
  changed_when: false

- name: Require admin password
  ansible.builtin.assert:
    that: admin_password.stdout.split()[1] == 'P'
    fail_msg: Set admin password by Admin Password section of infra/README.md

# Stolen SSH session or agent can’t become root without the password
- name: Ask admin password for sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-ai
    content: "ai ALL=(ALL:ALL) ALL\n"
    mode: '0440'
    validate: visudo -cf %s

- name: Remove sudo without password from cloud config
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent

- name: Create deploy user
  ansible.builtin.user:
    name: deploy
    shell: /bin/sh
    password_lock: true

- name: Create deploy SSH folder
  ansible.builtin.file:
    path: /home/deploy/.ssh
    state: directory
    owner: root
    group: deploy
    mode: '0750'

# deploy can only call deploy-request, which creates request files
- name: Add maintainers keys to deploy
  ansible.builtin.copy:
    dest: /home/deploy/.ssh/authorized_keys
    content: |
      {% for key in maintainer_keys %}
      restrict,command="/usr/local/bin/deploy-request" {{ key }}
      {% endfor %}
    owner: root
    group: deploy
    mode: '0640'

- name: Enable fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
    mode: '0644'
  notify: Restart fail2ban
