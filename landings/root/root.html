<!doctype html>
<html class="is-guest" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(aspect-ratio <= 3/4)"
      content="--top-color('../generated/main-portrait.avif')"
    />
    <meta
      name="theme-color"
      content="--top-color('../images/main/main.avif')"
    />
    <title>Slow Reader</title>
    <link rel="stylesheet" href="./root.css" />
    <script type="module" src="./root.js"></script>
  </head>

  <body>
    <header class="header">
      <div class="header_content">
        <span class="header_logo">
          <img
            class="header_logo_image"
            alt=""
            height="32"
            src="../generated/logo-64.png"
            width="32"
          />
        </span>
        <h1 class="header_name">Slow Reader</h1>
        <span class="header_dock">
          <a class="button is-app" href="/app">Open app</a>
          <a class="button is-demo" href="/copy-demo-db">
            <span class="button_long">Start demo</span>
            <span class="button_short">Demo</span>
          </a>
        </span>
        <a class="button is-login" href="/app">Login</a>
      </div>
    </header>

    <main>
      <section class="section is-hero">
        <picture>
          <source
            media="(aspect-ratio <= 3/4)"
            srcset="../images/main/main-portrait.avif"
          />
          <img
            class="section_image"
            alt=""
            fetchpriority="high"
            src="../images/main/main.avif"
          />
        </picture>
        <div class="section_content">
          <h2 class="section_title">
            Silicon Valley broke social media. We have an idea how to fix it.
          </h2>
          <div class="section_actions">
            <a class="button is-app is-big" href="/app">Open app</a>
            <a class="button is-demo is-big" href="/copy-demo-db">Start demo</a>
          </div>
        </div>
      </section>

      <section class="section"></section>
      <section class="section"></section>
    </main>
  </body>
</html>
