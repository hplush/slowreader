verify:
  # Hourly schedule, publish, new release, or manual run
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|push|trigger|web)$/
  # Only these hosted runners are privileged, which buildx replay needs
  tags:
    - saas-linux-small-amd64
  # Next run waits for the previous one, which could rebuild an image
  resource_group: verify
  image: docker:29.9.0-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00
  services:
    - docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
  variables:
    DOCKER_TLS_CERTDIR: /certs
    # Scripts find the last commit with verifier code in the history
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash cosign curl git github-cli jq openssh-keygen openssl
    # Docker’s own builder can’t replay builds
    - docker buildx create --use --driver docker-container
    - git config --global user.name "Slow Reader Verifier"
    - git config --global user.email "verifier@slowreader.app"
  script:
    - |
      STATUS=0
      ./check-releases.sh || STATUS=1
      ./check-site.sh || STATUS=1
      git add --all
      git diff --cached --quiet || git commit -qm "Check $(date -u +%FT%TZ)"
      # Scripts could be published during the check
      git fetch -q origin main
      git rebase -q FETCH_HEAD
      # Results push should not start another check
      git push -q -o ci.skip "https://verifier:${PUSH_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" HEAD:main
      exit $STATUS
