name: Loaders Test
on:
  push:
    branches:
      - main
    paths:
      - 'loader-tests/test-loaders.ts'
      - 'loader-tests/utils.ts'
      - 'loader-tests/feeds.yml'
      - 'core/**/*.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-loaders.yml'
      - '.github/actions/init-node/action.yml'
  pull_request:
    paths:
      - 'loader-tests/test-loaders.ts'
      - 'loader-tests/utils.ts'
      - 'loader-tests/feeds.yml'
      - 'core/**/*.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-loaders.yml'
      - '.github/actions/init-node/action.yml'
  schedule:
    - cron: '00 23 * * *' # Runs at midnight UTC every day
permissions:
  contents: read
jobs:
  test:
    name: Loader Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # Allow all to check feeds
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Node.js
        uses: $/.github/actions/init-node
      - name: Run tests
        run: pnpm -F loader-tests test:online:loaders --retry
