name: Loaders Test
on:
  push:
    branches:
      - main
    paths:
      - 'core/loader/**'
      - '!core/loader/telegram.ts'
      - 'core/lib/download.ts'
      - 'core/lib/html.ts'
      - 'core/lib/text.ts'
      - 'core/request.ts'
      - 'core/node.ts'
      - 'core/pages/add.ts'
      - 'proxy/**'
      - '!proxy/test/**'
      - '!proxy/**/*.md'
      - 'loader-tests/test-loaders.ts'
      - 'loader-tests/utils.ts'
      - 'loader-tests/feeds.yml'
      - '.github/workflows/test-loaders.yml'
  pull_request:
    paths:
      - 'core/loader/**'
      - '!core/loader/telegram.ts'
      - 'core/lib/download.ts'
      - 'core/lib/html.ts'
      - 'core/lib/text.ts'
      - 'core/request.ts'
      - 'core/node.ts'
      - 'core/pages/add.ts'
      - 'proxy/**'
      - '!proxy/test/**'
      - '!proxy/**/*.md'
      - 'loader-tests/test-loaders.ts'
      - 'loader-tests/utils.ts'
      - 'loader-tests/feeds.yml'
      - '.github/workflows/test-loaders.yml'
  schedule:
    - cron: '00 23 * * *' # Every day at 23:00 UTC
concurrency:
  group: loaders-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: Loader Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit # Allow all to check feeds
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Node.js
        uses: $/.github/actions/init-node
      - name: Run tests
        run: pnpm -F loader-tests test:online:loaders --retry
