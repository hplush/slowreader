name: Workflows Linter
on:
  push:
    branches:
      - main
    paths:
      - '.github/**/*.yml'
  pull_request:
    paths:
      - '.github/**/*.yml'
permissions:
  contents: read
jobs:
  test:
    name: Check workflows
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit # Allow all to validate links
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint CI workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
