name: Workflows Linter
on:
  push:
    branches:
      - main
    paths:
      - '.github/**/*.yml'
  pull_request:
    paths:
      - '.github/**/*.yml'
permissions:
  contents: read
jobs:
  test:
    name: Check workflows
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # Allow all to validate links
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint CI workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
