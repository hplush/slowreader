name: Workflows Linter
on:
  push:
    branches:
      - main
    paths:
      - '.github/**/*.yml'
  pull_request:
    paths:
      - '.github/**/*.yml'
permissions:
  contents: read
jobs:
  test:
    name: Check workflows
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit # Allow all to validate links
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint CI workflows
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
