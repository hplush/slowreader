name: Visual Test
on:
  schedule:
    - cron: '00 04 * * *' # Runs at night every day
  push:
    branches:
      - main
    paths:
      - '.github/workflows/visual.yml'
  pull_request:
    types:
      - labeled
      - synchronize
permissions:
  contents: read
jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' || (
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-visual'))
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            chromatic-builds.s3.us-west-2.amazonaws.com:443
            github.com:443
            index.chromatic.com:443
            nodejs.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            storybook.js.org:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use pull request commit instead of merge commit
        if: github.event_name == 'pull_request'
        run: git switch --force-create "$GITHUB_HEAD_REF" HEAD^2
      - name: Check if should run
        id: should_run
        if: github.event_name == 'schedule'
        run: |
          if [ -n "$(git log --since='24 hours ago' --format=%H -- web/ pnpm-lock.yaml)" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Initialize Node.js
        if: steps.should_run.outputs.should_run != 'false'
        uses: $/.github/actions/init-node
      - name: Publish to Chromatic
        if: steps.should_run.outputs.should_run != 'false'
        run: pnpm -F web chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
