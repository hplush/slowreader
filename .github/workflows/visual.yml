name: Visual Test
on:
  schedule:
    - cron: '00 04 * * *' # Runs at night every day
  push:
    branches:
      - main
    paths:
      - '.github/workflows/visual.yml'
  pull_request:
    types:
      - labeled
      - synchronize
permissions:
  contents: read
jobs:
  chromatic:
    name: Chromatic
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-visual')
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            chromatic-builds.s3.us-west-2.amazonaws.com:443
            github.com:443
            index.chromatic.com:443
            nodejs.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            storybook.js.org:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check if should run
        id: should_run
        if: github.event_name == 'schedule'
        run: |
          now=$(date -u +%s)
          twenty_four_hours_ago=$((now - 86400))
          last_commit_time=$(git log -1 --format=%ct)
          if [ "$last_commit_time" -ge "$twenty_four_hours_ago" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Initialize Node.js
        if: steps.should_run.outputs.should_run != 'false'
        uses: ./.github/actions/init-node
      - name: Publish to Chromatic
        if: steps.should_run.outputs.should_run != 'false'
        run: cd web && pnpm chromatic --skip-update-check
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
