name: Deploy Preview
on:
  workflow_run:
    workflows:
      - Start Preview Deployment
    types:
      - completed
permissions:
  contents: read
  packages: write
  deployments: write
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: staging-web
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cloud.hplush.dev:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            raw.githubusercontent.com:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download server from prepare step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-server
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.PREVIEW_ARTIFACT_PAT }}
          path: ./untrusted/
      - name: Extract PR number
        run: |
          PR_NUMBER=$(cat ./untrusted/preview-id)
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid preview-id: $PR_NUMBER"
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
      - name: Check preview label
        run: |
          LABELS=$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json labels --jq '.labels[].name')
          if ! echo "$LABELS" | grep -qx 'preview'; then
            echo "PR #$PR_NUMBER does not have 'preview' label, skipping deploy"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify about new deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.workflow_run.head_commit.id }}
        run: |
          DEPLOY=$(jq -n --arg ref "$REF" \
            --arg environment "preview-$PR_NUMBER" \
            '{
              auto_merge: false,
              description: "Preview deployment",
              environment: $environment,
              ref: $ref,
              required_contexts: [],
              transient_environment: true
            }')
          ID=$(echo "$DEPLOY" \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" \
              --input - --jq '.id')
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=in_progress \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /dev/null
          echo "DEPLOYMENT_ID=$ID" >> $GITHUB_ENV
      - name: Load Docker image
        run: docker load < ./untrusted/image.tar
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: docker push ghcr.io/hplush/slowreader:preview-$PR_NUMBER
      - name: Deploy to Dokploy
        id: deploy
        env:
          API: https://cloud.hplush.dev/api
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
        run: |
          dokploy_api() {
            if [ -n "$2" ]; then
              curl -s -X POST "$API/$1" \
                -H 'accept: application/json' \
                -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'Content-Type: application/json' \
                -d "$2"
            else
              curl -s "$API/$1" \
                -H "x-api-key: $DOKPLOY_TOKEN"
            fi
          }

          APP_NAME="Preview $PR_NUMBER"
          PROJECTS=$(dokploy_api project.all)
          FIND='[.[].environments[].applications[]
            | select(.name == $name)][0]
            | .applicationId // empty'
          APP_ID=$(echo "$PROJECTS" \
            | jq -r --arg name "$APP_NAME" "$FIND")
          if [ -z "$APP_ID" ]; then

            ENV_ID=$(echo "$PROJECTS" | jq -r \
              '[.[].environments[]
                | select(.name == "production")][0]
                | .environmentId')
            APP_ID=$(dokploy_api application.create \
              "{\"name\": \"$APP_NAME\",
                \"environmentId\": \"$ENV_ID\"}" \
              | jq -r '.applicationId')

            IMAGE='ghcr.io/hplush/slowreader:preview-${{ env.PR_NUMBER }}'
            dokploy_api application.update \
              "{\"applicationId\": \"$APP_ID\",
                \"sourceType\": \"docker\",
                \"dockerImage\": \"$IMAGE\"}"

            HOST="preview-$PR_NUMBER.app.hplush.dev"
            dokploy_api domain.create \
              "{\"applicationId\": \"$APP_ID\",
                \"host\": \"$HOST\",
                \"port\": 2554,
                \"https\": true,
                \"certificateType\": \"letsencrypt\"}"

            ORIGIN="^https:\\/\\/$(echo "$HOST" | sed 's/\./\\\\./g')\$"
            ENV="ASSETS=1\nDATABASE_URL=memory://\nPROXY_ORIGIN=$ORIGIN"
            dokploy_api application.saveEnvironment \
              "{\"applicationId\": \"$APP_ID\",
                \"env\": \"$ENV\",
                \"buildArgs\": null,
                \"buildSecrets\": null,
                \"createEnvFile\": false}"

            dokploy_api application.deploy \
              "{\"applicationId\": \"$APP_ID\"}"

          else
            dokploy_api application.redeploy \
              "{\"applicationId\": \"$APP_ID\"}"
          fi
      - name: Wait for deployment
        run: sleep 120
      - name: Update deployment status
        if: always() && env.DEPLOYMENT_ID
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            STATE='success'
          else
            STATE='failure'
          fi
          gh api \
            "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$STATE" \
            -f environment_url="https://preview-$PR_NUMBER.app.hplush.dev/ui/" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /dev/null
