name: Clean Old Docker Images
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/clean-images.yml'
      - '.github/actions/init-node/action.yml'
  pull_request:
    paths:
      - '.github/workflows/clean-images.yml'
      - '.github/actions/init-node/action.yml'
  schedule:
    - cron: '00 10 * * 1' # Every Monday at 10:00 UTC
permissions:
  packages: write
jobs:
  clean:
    name: Clean Untagged Images
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Delete untagged images older than a week
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK_AGO=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for PACKAGE in slowreader slowreader-web slowreader-proxy; do
            VERSIONS="orgs/hplush/packages/container/$PACKAGE/versions"
            # We push single-platform images without buildx attestations,
            # so untagged versions are only the images replaced by a new push
            OLD=$(gh api --paginate "$VERSIONS?per_page=100" \
              | jq -r --arg date "$WEEK_AGO" \
                '.[] | select(.metadata.container.tags == [] and
                  .updated_at < $date) | .id')
            for ID in $OLD; do
              echo "Deleting $PACKAGE version $ID"
              gh api -X DELETE "$VERSIONS/$ID" --silent
            done
          done
