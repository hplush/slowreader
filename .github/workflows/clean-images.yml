name: Clean Old Docker Images
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/clean-images.yml'
      - '.github/actions/init-node/action.yml'
  pull_request:
    paths:
      - '.github/workflows/clean-images.yml'
      - '.github/actions/init-node/action.yml'
  schedule:
    - cron: '00 10 * * 1' # Every Monday at 10:00 UTC
permissions:
  packages: write
jobs:
  clean:
    name: Clean Untagged Images
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
      - name: Delete untagged images older than a week
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK_AGO=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          VERSIONS="orgs/hplush/packages/container/slowreader/versions"
          ALL=$(gh api --paginate "$VERSIONS?per_page=100" | jq -s 'add')
          # Tagged image index refers to untagged image and provenance
          KEEP=$(jq -r '.[].metadata.container.tags[]' <<< "$ALL" \
            | xargs -I {} docker buildx imagetools inspect --raw \
              ghcr.io/hplush/slowreader:{} \
            | jq -s '[.[].manifests[]?.digest]')
          # Other untagged versions are images replaced by a new push
          # or not tagged because of failed tests
          OLD=$(jq -r --arg date "$WEEK_AGO" --argjson keep "$KEEP" \
            '.[] | select(.metadata.container.tags == [] and
              .updated_at < $date and
              (.name | IN($keep[]) | not)) | .id' \
            <<< "$ALL")
          for ID in $OLD; do
            echo "Deleting slowreader version $ID"
            gh api -X DELETE "$VERSIONS/$ID" --silent
          done
      - name: Delete demo images older than 6 months
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HALF_YEAR_AGO=$(date -u -d '6 months ago' +%Y-%m-%dT%H:%M:%SZ)
          VERSIONS="orgs/hplush/packages/container/slowreader-demo/versions"
          # Dockerfile pins demo image by digest, so we keep old images
          # to rebuild the same image from 6 months old commits
          OLD=$(gh api --paginate "$VERSIONS?per_page=100" \
            | jq -r --arg date "$HALF_YEAR_AGO" \
              '.[] | select((.metadata.container.tags | index("latest") | not)
                and .created_at < $date) | .id')
          for ID in $OLD; do
            echo "Deleting slowreader-demo version $ID"
            gh api -X DELETE "$VERSIONS/$ID" --silent
          done
