name: Clean Old Docker Images
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/clean-images.yml'
      - '.github/actions/init-node/action.yml'
  pull_request:
    paths:
      - '.github/workflows/clean-images.yml'
      - '.github/actions/init-node/action.yml'
  schedule:
    - cron: '00 10 * * 1' # Every Monday at 10:00 UTC
permissions:
  packages: write
jobs:
  clean:
    name: Clean Untagged Images
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ghcr.io:443
      - name: Clean slowreader-web
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: slowreader-web
          owner: hplush
          delete-untagged: true
          older-than: 1 week
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean slowreader
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: slowreader
          owner: hplush
          delete-untagged: true
          older-than: 1 week
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean slowreader-proxy
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: slowreader-proxy
          owner: hplush
          delete-untagged: true
          older-than: 1 week
          token: ${{ secrets.GITHUB_TOKEN }}
