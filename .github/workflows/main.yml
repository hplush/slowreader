name: Main
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.githooks/**'
      - '.devcontainer/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.githooks/**'
      - '.devcontainer/**'
jobs:
  test:
    name: General Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            github.com:443
            nodejs.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            storybook.js.org:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize Node.js
        uses: $/.github/actions/init-node
      - name: Copy landing screenshots from the demo image
        run: |
          IMAGE=$(grep -oE 'ghcr.io/hplush/slowreader-demo@sha256:[0-9a-f]+' Dockerfile)
          docker create --name demo "$IMAGE" none
          docker cp demo:/screenshots landings/screenshots
      - name: Build landings
        run: pnpm -F landings build
      - name: Download passkey providers
        run: pnpm -F server aaguids
      - name: Run tests
        run: pnpm run --aggregate-output --parallel -F '*' -F '!loader-tests' '/^test:/'
        env:
          FORCE_COLOR: 1
  build:
    name: Image Build
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
            api.github.com:443
            apk.cgr.dev:443
            auth.docker.io:443
            cgr.dev:443
            codeload.github.com:443
            ghcr.io:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          # Docker’s own builder can’t rewrite timestamps
          docker buildx create --use --driver docker-container
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            docker buildx build --provenance=false \
              --output type=image,name=ghcr.io/hplush/slowreader:dev,push=true,rewrite-timestamp=true .
  staging:
    name: Staging Deploy
    needs: build
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        domain:
          - dev.slowreader.app
          - proxy.dev.slowreader.app
    concurrency:
      group: staging-${{ matrix.domain }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.cloud.hplush.dev:443
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443
      - name: Deploy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOMAIN: ${{ matrix.domain }}
        with:
          script: |
            let token = await core.getIDToken('https://api.cloud.hplush.dev')
            let response = await fetch(
              `https://api.cloud.hplush.dev/deploy/${process.env.DOMAIN}`,
              { method: 'POST', headers: { authorization: `Bearer ${token}` } }
            )
            let answer = await response.text()
            if (response.ok) core.info(answer)
            else core.setFailed(`${response.status} ${response.statusText}: ${answer}`)
