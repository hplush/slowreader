name: Main
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.claude/**'
      - '.githooks/**'
      - '.devcontainer/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.vscode/**'
      - '.claude/**'
      - '.githooks/**'
      - '.devcontainer/**'
jobs:
  test:
    name: General Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            storybook.js.org:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Node.js
        uses: ./.github/actions/init-node
      - name: Run tests
        run: pnpm run -r --include-workspace-root '/^test:(?!online:markdown\b|proxy-coverage\b|server-coverage\b|online:loaders\b)/'
        env:
          FORCE_COLOR: 1
          STAGING: 1
      - name: Double-check Svelte types with old tool
        run: cd web && pnpm svelte-check
      - name: Build nginx config
        run: cd web && ./scripts/build-nginx-config.sh
      - name: Upload web assets
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-client-assets-${{ github.sha }}
          retention-days: 1
          include-hidden-files: true
          path: |
            web/dist/
            web/nginx.conf.compiled
  staging:
    name: Web Staging Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    concurrency:
      group: staging-web
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
            api.github.com:443
            cgr.dev:443
            github.com:443
            raw.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            cloud.hplush.dev:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download web assets from test step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-client-assets-${{ github.sha }}
          path: web/
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          image-name: slowreader-web
          context: ./web/
          application-id: UfN7W6Kqhd3kw8QmKRELX
          token: ${{ secrets.GITHUB_TOKEN }}
          dokploy-token: ${{ secrets.DOKPLOY_TOKEN }}
