name: Demo Database
on:
  pull_request:
    paths:
      - 'web/demo/build-demo-db.ts'
      - 'web/demo/demo-feeds.opml'
      - 'web/demo/demo-sources.json'
      - '.github/workflows/demo-db.yml'
      - 'web/demo/Dockerfile'
      - 'landings/scripts/screenshots.ts'
      - 'landings/og/**'
      - 'landings/vite/og.ts'
      - 'landings/chromium.ts'
  # Release script asks to run it, also to refresh the posts before a demo
  workflow_dispatch:
jobs:
  build:
    name: Build Demo Database and Screenshots
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # Allow all to load the demo feeds
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Node.js
        uses: $/.github/actions/init-node
      - name: Build the database
        run: pnpm -F web build-demo
        env:
          FORCE_COLOR: 1
      - name: Make landing screenshots
        run: pnpm -F landings screenshots
        env:
          FORCE_COLOR: 1
      - name: Make OG image
        run: pnpm -F landings build
        env:
          FORCE_COLOR: 1
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Dated tag keeps old images, which Dockerfile can still pin
      - name: Build the image
        run: |
          IMAGE=ghcr.io/hplush/slowreader-demo
          docker build -f web/demo/Dockerfile \
            -t "$IMAGE:$(date -u +%Y-%m-%d-%H%M)" -t "$IMAGE:latest" .
      - name: Push the image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags ghcr.io/hplush/slowreader-demo
