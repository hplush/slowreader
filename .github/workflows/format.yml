name: Fix code style
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format.yml'
      - '.github/actions/init-node/action.yml'
  pull_request:
    paths:
      - '.github/workflows/format.yml'
      - '.github/actions/init-node/action.yml'
  schedule:
    - cron: '00 04 * * *' # Every day at 04:00 UTC
permissions:
  contents: write
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Initialize Node.js
        uses: $/.github/actions/init-node
      - name: Check for today commits
        id: today
        run: |
          today=$(date -u +"%Y-%m-%d")
          last_commit_date=$(git log -1 --format=%cd --date=short)
          if [ "$today" == "$last_commit_date" ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "No commits today. Stopping the workflow."
          fi
      - name: Format code
        if: steps.today.outputs.has_commits == 'true'
        run: node --run format
      - name: Commit changes
        if: steps.today.outputs.has_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # GitHub signs commits made by API, so they pass signed commits rule
          git diff --name-only -z | while read -r -d '' file; do
            jq -n --arg path "$file" --rawfile contents <(base64 -w0 "$file") \
              '{path: $path, contents: $contents}'
          done | jq -s \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg head "$(git rev-parse HEAD)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "Auto-format code" },
                fileChanges: { additions: . }
              } }
            }' > request.json
          gh api graphql --input request.json --jq .data.createCommitOnBranch.commit.url
