name: Messages
on:
  schedule:
    - cron: '00 04 * * 1' # Every Monday at 04:00 UTC
  push:
    branches:
      - main
    paths:
      - '.github/workflows/messages.yml'
  pull_request:
    paths:
      - '.github/workflows/messages.yml'
permissions:
  contents: read
jobs:
  unused:
    name: Find Unused
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check if should run
        id: should_run
        run: |
          now=$(date -u +%s)
          seven_days_ago=$((now - 604800))
          last_commit_time=$(git log -1 --format=%ct)
          if [ "$last_commit_time" -ge "$seven_days_ago" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Initialize Node.js
        if: steps.should_run.outputs.should_run == 'true'
        uses: $/.github/actions/init-node
      - name: Run script
        if: steps.should_run.outputs.should_run == 'true'
        run: pnpm unused-messages
