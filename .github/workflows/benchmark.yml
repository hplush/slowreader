name: Benchmark
on:
  schedule:
    - cron: '00 05 * * 1' # Every Monday at 05:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same code is faster or slower on different runners
        runner: [1, 2, 3]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cdn.playwright.dev:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            playwright.download.prss.microsoft.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Node.js
        uses: $/.github/actions/init-node
      # Ubuntu allows the sandbox only for Chrome from the system
      - name: Allow sandbox for downloaded Chromium
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run benchmark
        run: node web/scripts/benchmark.ts --json > result.json
      - name: Save result for merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.runner }}
          path: result.json
      - name: Check that all scenario runs passed
        run: jq --exit-status '.total.failed == 0' result.json
  save:
    name: Save
    needs: run
    # Runners, which finished, are enough
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nodejs.org:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
      - name: Merge results of runners
        run: node web/scripts/benchmark-merge.ts results/*/result.json
      - name: Save the run to benchmark branch
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub signs commits made by API, so they pass signed commits rule
          TREE=$(jq -n --rawfile metrics metrics.prom '{
            tree: [
              { path: "metrics.prom", mode: "100644", type: "blob", content: $metrics }
            ]
          }' | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)
          # Commit without parents replaces the branch, so the repository
          # does not grow every week
          COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" \
            -f message='Save the last benchmark run' -f tree="$TREE" --jq .sha)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/benchmark" \
            -f sha="$COMMIT" -F force=true ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/benchmark -f sha="$COMMIT"
