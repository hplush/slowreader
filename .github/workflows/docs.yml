name: Markdown Linter
on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '!unreleased-changes/*.md'
      - '.remarkrc'
      - '.remarkignore'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
      - '.github/actions/init-node/action.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '!unreleased-changes/*.md'
      - '.remarkrc'
      - '.remarkignore'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
      - '.github/actions/init-node/action.yml'
  schedule:
    - cron: '00 23 * * 1' # Every Monday at 23:00 UTC
permissions:
  contents: read
jobs:
  test:
    name: Check Docs
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit # Allow all to validate links
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize Node.js
        uses: $/.github/actions/init-node
        with:
          install: -F .
      - name: Check docs
        run: node --run own:online:markdown
