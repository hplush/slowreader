name: Reproducible Build
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'test/reproducible.sh'
      - '.github/workflows/reproducible.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'test/reproducible.sh'
      - '.github/workflows/reproducible.yml'
  schedule:
    - cron: '00 09 * * 3' # Runs at 11:00 in Spain every Wednesday (10:00 in winter)
permissions:
  contents: read
jobs:
  test:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # Build downloads from many registries
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check reproducible build
        run: |
          # Docker’s own builder can’t rewrite timestamps
          docker buildx create --use --driver docker-container
          ./test/reproducible.sh
